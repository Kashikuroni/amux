[package]
name = "amux"
version = "0.6.0"
edition = "2021"
description = "A terminal cockpit for AI coding agents: manage parallel tmux sessions running Claude Code, Codex, Gemini, Aider and more — with live previews, git worktrees, and per-session markdown notes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kashikuroni/amux"
homepage = "https://github.com/kashikuroni/amux"
readme = "README.md"
keywords = ["tui", "tmux", "ai", "agent", "claude"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.82"

# cargo-binstall: fetch the prebuilt binary from GitHub Releases (no crates.io,
# no compile). `cargo binstall --git https://github.com/Kashikuroni/amux amux`.
# Asset naming matches .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

# The library keeps the short internal name `am` so existing `am::` paths in the
# binary and tests are unchanged; the installed binary is `amux`.
[lib]
name = "am"
path = "src/lib.rs"

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
# main.rs uses crossterm and ratatui directly for terminal setup
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
amux-core = { path = "crates/amux-core" }
amux-tui = { path = "crates/amux-tui" }

[workspace]
members = ["crates/amux-verify", "crates/amux-core", "crates/amux-tui", "crates/amux-desktop"]
