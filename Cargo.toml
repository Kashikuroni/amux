[package]
name = "am"
version = "0.1.0"
edition = "2021"

[lib]
name = "am"
path = "src/lib.rs"

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ansi-to-tui = "7"
