name: Release

# Build macOS binaries and attach them to the GitHub Release when a vX.Y.Z tag
# is pushed. Create the tag with: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-binaries:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Builds `amux` for the target and uploads a tarball to the release for
      # the pushed tag (creating the release if needed). The token is provided
      # automatically; no untrusted input is interpolated into shell commands.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: amux
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
